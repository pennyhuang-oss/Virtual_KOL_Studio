<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 155" width="204mm" height="155mm">
<title>2027 桌曆封面候選 H-B｜B 極簡典藏（橫式，含 2 mm 出血）</title>
<style>@font-face{font-family:'Bodoni Moda 96pt';src:url('fonts/BodoniModa-96-Regular.ttf')}@font-face{font-family:'Inter Medium';src:url('fonts/Inter-Medium.ttf')}.txt text{font-kerning:none;font-feature-settings:'kern' 0,'liga' 0}</style>
<defs>
<radialGradient id="ground" cx="0.3" cy="0.3" r="0.75" gradientTransform="translate(0.3 0.3) scale(1 1.316) translate(-0.3 -0.3)">
<stop offset="0" stop-color="#2B2F37"/><stop offset="0.45" stop-color="#22252C"/><stop offset="1" stop-color="#16181D"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0.25" stop-color="#F3EBDD" stop-opacity="0"/><stop offset="0.42" stop-color="#F3EBDD" stop-opacity="0.045"/><stop offset="0.55" stop-color="#F3EBDD" stop-opacity="0"/></linearGradient>
<filter id="grain" x="0" y="0" width="204" height="155" filterUnits="userSpaceOnUse">
 <feTurbulence type="fractalNoise" baseFrequency="3.0" numOctaves="1" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<g id="art">
<rect width="204" height="155" fill="url(#ground)"/>
<rect width="204" height="155" fill="url(#sheen)"/>
<rect width="204" height="155" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:screen"/>
</g>
<g class="vec"><line x1="16" y1="106" x2="188" y2="106" stroke="#EDE5D7" stroke-width="0.18" stroke-opacity="0.6"/></g>
<defs><linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="55" x2="0" y2="100"><stop offset="0" stop-color="#F4EEE3"/><stop offset="1" stop-color="#E4DACA"/></linearGradient></defs>
<g class="txt">
<text x="14.5" y="101" font-family="&apos;Bodoni Moda 96pt&apos;" font-size="58" letter-spacing="-0.6" fill="url(#ink)">2027</text>
<text x="154.111" y="113.5" font-family="&apos;Inter Medium&apos;" font-size="2.4" letter-spacing="1.15" fill="#EDE5D7" fill-opacity="0.78">DESK CALENDAR</text>
</g>
</svg>
